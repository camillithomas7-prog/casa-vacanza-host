<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bgm" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#0a3742"/>
      <stop offset="60%" stop-color="#155e75"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="vanbody" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#fff7ec"/>
      <stop offset="100%" stop-color="#ffd5a4"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bgm)"/>
  <g opacity="0.22">
    <line x1="100" y1="500" x2="700" y2="500" stroke="#fff" stroke-width="2" stroke-dasharray="20 14"/>
  </g>
  <ellipse cx="400" cy="490" rx="280" ry="14" fill="#000" opacity="0.4"/>
  <g transform="translate(160 230)">
    <!-- body -->
    <path d="M 20 50 Q 30 30 60 25 L 420 25 Q 460 25 470 60 L 470 200 L 20 200 Z" fill="url(#vanbody)" stroke="#0d0e15" stroke-width="3"/>
    <!-- windshield -->
    <path d="M 65 40 Q 90 35 120 35 L 130 90 L 65 90 Z" fill="#a5f3fc" stroke="#0d0e15" stroke-width="2"/>
    <!-- side windows row (4 windows) -->
    <rect x="140" y="45" width="65" height="55" rx="3" fill="#a5f3fc" stroke="#0d0e15" stroke-width="2"/>
    <rect x="215" y="45" width="65" height="55" rx="3" fill="#a5f3fc" stroke="#0d0e15" stroke-width="2"/>
    <rect x="290" y="45" width="65" height="55" rx="3" fill="#a5f3fc" stroke="#0d0e15" stroke-width="2"/>
    <rect x="365" y="45" width="65" height="55" rx="3" fill="#a5f3fc" stroke="#0d0e15" stroke-width="2"/>
    <!-- door -->
    <line x1="280" y1="100" x2="280" y2="200" stroke="#0d0e15" stroke-width="2" opacity="0.5"/>
    <!-- side stripe -->
    <rect x="20" y="140" width="450" height="6" fill="#ff6a0a"/>
    <!-- headlight -->
    <ellipse cx="40" cy="130" rx="12" ry="8" fill="#ffd5a4"/>
    <ellipse cx="455" cy="80" rx="6" ry="8" fill="#ffd5a4"/>
    <!-- wheels -->
    <circle cx="100" cy="210" r="36" fill="#0d0e15"/>
    <circle cx="100" cy="210" r="20" fill="#737486"/>
    <circle cx="100" cy="210" r="6" fill="#0d0e15"/>
    <circle cx="380" cy="210" r="36" fill="#0d0e15"/>
    <circle cx="380" cy="210" r="20" fill="#737486"/>
    <circle cx="380" cy="210" r="6" fill="#0d0e15"/>
  </g>
  <text x="400" y="558" text-anchor="middle" font-family="Plus Jakarta Sans, sans-serif" font-weight="800" font-size="28" fill="#fff" opacity="0.85">Minibus 7 posti</text>
</svg>
