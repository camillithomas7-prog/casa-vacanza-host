<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bgs" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#eef9f9"/>
      <stop offset="60%" stop-color="#aae0e0"/>
      <stop offset="100%" stop-color="#258a8c"/>
    </linearGradient>
    <linearGradient id="scbody" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#ff8a32"/>
      <stop offset="100%" stop-color="#f04e00"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bgs)"/>
  <ellipse cx="400" cy="490" rx="260" ry="14" fill="#0d0e15" opacity="0.18"/>
  <g transform="translate(220 200)">
    <!-- handlebar/front -->
    <path d="M 60 0 L 80 0 L 90 130 L 70 130 Z" fill="#2f303d"/>
    <circle cx="55" cy="-10" r="14" fill="#2f303d"/>
    <line x1="40" y1="-10" x2="80" y2="-10" stroke="#2f303d" stroke-width="6" stroke-linecap="round"/>
    <!-- light -->
    <ellipse cx="78" cy="80" rx="14" ry="20" fill="#ffd5a4"/>
    <!-- main body -->
    <path d="M 80 80 L 280 80 L 320 140 L 320 220 L 220 220 Q 200 180 160 180 Q 120 180 100 220 L 70 220 Q 60 200 60 180 L 70 130 Z" fill="url(#scbody)" stroke="#2f303d" stroke-width="3"/>
    <!-- seat -->
    <rect x="160" y="55" width="120" height="32" rx="14" fill="#1a1b25"/>
    <rect x="220" y="20" width="64" height="40" rx="10" fill="#1a1b25"/>
    <!-- footrest -->
    <rect x="100" y="170" width="80" height="14" rx="3" fill="#2f303d"/>
    <!-- wheels -->
    <circle cx="150" cy="240" r="36" fill="#1a1b25"/>
    <circle cx="150" cy="240" r="22" fill="#737486"/>
    <circle cx="150" cy="240" r="6" fill="#1a1b25"/>
    <circle cx="290" cy="240" r="36" fill="#1a1b25"/>
    <circle cx="290" cy="240" r="22" fill="#737486"/>
    <circle cx="290" cy="240" r="6" fill="#1a1b25"/>
  </g>
  <text x="400" y="548" text-anchor="middle" font-family="Plus Jakarta Sans, sans-serif" font-weight="800" font-size="28" fill="#0d0e15" opacity="0.7">Scooter 50cc</text>
</svg>
